<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="capsule-title capsule-desc">
  <title id="capsule-title">Smart capsule</title>
  <desc id="capsule-desc">A polished translucent blue and green medical capsule with a digital particle core.</desc>
  <defs>
    <linearGradient id="capsule-blue" x1="16" y1="47" x2="35" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2878FF" stop-opacity=".92"/>
      <stop offset="1" stop-color="#37C8F5" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="capsule-green" x1="34" y1="34" x2="48" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25D3A1" stop-opacity=".34"/>
      <stop offset="1" stop-color="#DFFFF6" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="capsule-rim" x1="12" y1="50" x2="52" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18354F"/>
      <stop offset=".42" stop-color="#2878FF"/>
      <stop offset="1" stop-color="#25D3A1"/>
    </linearGradient>
    <filter id="capsule-shadow" x="7" y="8" width="52" height="51" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#18354F" flood-opacity=".17"/>
    </filter>
    <clipPath id="capsule-clip">
      <rect x="10" y="22" width="44" height="20" rx="10"/>
    </clipPath>
  </defs>
  <g filter="url(#capsule-shadow)">
    <g transform="rotate(-40 32 32)">
      <g clip-path="url(#capsule-clip)">
        <rect x="10" y="22" width="22" height="20" fill="url(#capsule-green)"/>
        <rect x="32" y="22" width="22" height="20" fill="url(#capsule-blue)"/>
        <path d="M15 26.3h30" stroke="#fff" stroke-opacity=".58" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M47 25.8h4.5v12.4H47" stroke="#fff" stroke-opacity=".2" stroke-width="3.8" stroke-linecap="round"/>
        <circle cx="20" cy="32" r="2.25" fill="#fff" fill-opacity=".82"/>
        <circle cx="25" cy="35.5" r="1.3" fill="#25D3A1"/>
        <circle cx="25.8" cy="28.5" r="1" fill="#37C8F5"/>
      </g>
      <rect x="10" y="22" width="44" height="20" rx="10" stroke="url(#capsule-rim)" stroke-width="1.8"/>
      <path d="M32 22v20" stroke="#fff" stroke-opacity=".8" stroke-width="3.8"/>
      <path d="M32 22v20" stroke="#2878FF" stroke-opacity=".64" stroke-width="1.5"/>
    </g>
  </g>
  <path d="M48.5 11.5v6M45.5 14.5h6" stroke="#25D3A1" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="11.5" cy="50.5" r="2.5" fill="#37C8F5" fill-opacity=".18" stroke="#37C8F5" stroke-width="1.2"/>
</svg>
