    <circle cx="22.2" cy="46.85" r="6.3" fill="url(#molecule-pale)" stroke="#37C8F5" stroke-width="1.4"/>
    <circle cx="15.5" cy="23.2" r="5.5" fill="url(#molecule-green)" stroke="#25D3A1" stroke-width="1.4"/>
    <ellipse cx="27.2" cy="27.5" rx="2.6" ry="1.8" transform="rotate(-35 27.2 27.5)" fill="#fff" fill-opacity=".72"/>
  </g>
  <circle cx="51.8" cy="12.2" r="2" fill="#37C8F5" fill-opacity=".2" stroke="#37C8F5" stroke-width="1.1"/>
  <circle cx="12.2" cy="49.8" r="1.7" fill="#25D3A1" fill-opacity=".22"/>
