<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="health-data-title health-data-desc">
  <title id="health-data-title">Health data</title>
  <desc id="health-data-desc">A luminous health data dial with a heart, pulse trace, and analytics markers.</desc>
  <defs>
    <linearGradient id="health-data-ring" x1="13" y1="12" x2="52" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#37C8F5"/>
      <stop offset=".55" stop-color="#2878FF"/>
      <stop offset="1" stop-color="#25D3A1"/>
    </linearGradient>
    <radialGradient id="health-data-face" cx="0" cy="0" r="1" gradientTransform="translate(27 24) rotate(49) scale(25)">
      <stop stop-color="#fff" stop-opacity=".98"/>
      <stop offset=".56" stop-color="#E7F8FF" stop-opacity=".58"/>
      <stop offset="1" stop-color="#25D3A1" stop-opacity=".1"/>
    </radialGradient>
    <linearGradient id="health-data-heart" x1="24" y1="24" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2878FF"/>
      <stop offset="1" stop-color="#25D3A1"/>
    </linearGradient>
    <filter id="health-data-shadow" x="5" y="5" width="54" height="55" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.4" flood-color="#18354F" flood-opacity=".16"/>
    </filter>
  </defs>
  <g filter="url(#health-data-shadow)">
    <circle cx="32" cy="31.5" r="22.5" fill="url(#health-data-face)" stroke="#DCEAF2" stroke-width="1.3"/>
    <path d="M32 9a22.5 22.5 0 0 1 22.23 18.99" stroke="url(#health-data-ring)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M53.97 36.36A22.5 22.5 0 0 1 19.1 49.94" stroke="#25D3A1" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M13.65 44.52A22.5 22.5 0 0 1 12.9 19.61" stroke="#2878FF" stroke-opacity=".52" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M32 44.2s-12-6.96-12-15.1a7 7 0 0 1 12-4.89 7 7 0 0 1 12 4.89c0 8.14-12 15.1-12 15.1Z" fill="url(#health-data-heart)" fill-opacity=".16" stroke="url(#health-data-heart)" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M17 33h7.2l2.35-5.05 3.67 10.15 3.4-6.85 2.2 3.35H47" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M17 33h7.2l2.35-5.05 3.67 10.15 3.4-6.85 2.2 3.35H47" stroke="#37C8F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="47" cy="34.6" r="2.1" fill="#25D3A1" stroke="#fff" stroke-width="1.1"/>
  </g>
  <circle cx="11.1" cy="15.1" r="2.1" fill="#25D3A1"/>
  <circle cx="55" cy="42" r="1.7" fill="#2878FF" fill-opacity=".22"/>
