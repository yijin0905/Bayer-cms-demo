<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="ddl-title ddl-desc">
  <title id="ddl-title">AI 药物发现实验室</title>
  <desc id="ddl-desc">透明胶囊分析舱、分子网络、机械扫描臂与玻璃数据面板组成的智能药物发现实验室。</desc>
  <defs>
    <linearGradient id="ddl-platform" x1="268" y1="464" x2="867" y2="797" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F5FAFD"/>
      <stop offset="1" stop-color="#E6EFF5"/>
    </linearGradient>
    <linearGradient id="ddl-platform-side" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#D6E5EE"/>
      <stop offset="1" stop-color="#F7FAFC"/>
    </linearGradient>
    <linearGradient id="ddl-glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset=".3" stop-color="#BFEFFF" stop-opacity=".62"/>
      <stop offset=".62" stop-color="#37C8F5" stop-opacity=".3"/>
      <stop offset="1" stop-color="#2878FF" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="ddl-teal-glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F2FFFC" stop-opacity=".94"/>
      <stop offset=".25" stop-color="#8AF2D6" stop-opacity=".7"/>
      <stop offset=".62" stop-color="#25D3A1" stop-opacity=".35"/>
      <stop offset="1" stop-color="#0C9180" stop-opacity=".64"/>
    </linearGradient>
    <linearGradient id="ddl-capsule-blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E8FAFF"/>
      <stop offset=".34" stop-color="#72DFF9"/>
      <stop offset="1" stop-color="#2878FF"/>
    </linearGradient>
    <linearGradient id="ddl-capsule-green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EDFFF9"/>
      <stop offset=".4" stop-color="#64E7C4"/>
      <stop offset="1" stop-color="#14A985"/>
    </linearGradient>
    <linearGradient id="ddl-metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".36" stop-color="#F4F9FC"/>
      <stop offset=".68" stop-color="#C9D9E4"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="ddl-blue-metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A9EAFF"/>
      <stop offset=".28" stop-color="#4FB9F4"/>
      <stop offset=".7" stop-color="#2878FF"/>
      <stop offset="1" stop-color="#194D9E"/>
    </linearGradient>
    <linearGradient id="ddl-screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".88"/>
      <stop offset=".45" stop-color="#D3F8F2" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7DDBF7" stop-opacity=".38"/>
    </linearGradient>
    <radialGradient id="ddl-node-blue" cx="34%" cy="28%" r="72%">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".27" stop-color="#B5EFFF"/>
      <stop offset=".64" stop-color="#37C8F5"/>
      <stop offset="1" stop-color="#2878FF"/>
    </radialGradient>
    <radialGradient id="ddl-node-green" cx="34%" cy="28%" r="72%">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".28" stop-color="#AEFFE9"/>
      <stop offset=".68" stop-color="#25D3A1"/>
      <stop offset="1" stop-color="#0B8C77"/>
    </radialGradient>
    <radialGradient id="ddl-chamber-light" cx="50%" cy="45%" r="56%">
      <stop stop-color="#FFFFFF" stop-opacity=".92"/>
      <stop offset=".35" stop-color="#B6FFF0" stop-opacity=".48"/>
      <stop offset=".7" stop-color="#37C8F5" stop-opacity=".12"/>
      <stop offset="1" stop-color="#2878FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ddl-grid" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="skewX(-28)">
      <path d="M30 0H0V30" fill="none" stroke="#2878FF" stroke-opacity=".11"/>
    </pattern>
    <filter id="ddl-shadow" x="-40%" y="-45%" width="180%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#6B8CA2" flood-opacity=".23"/>
    </filter>
    <filter id="ddl-small-shadow" x="-50%" y="-60%" width="200%" height="230%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#4E7188" flood-opacity=".23"/>
    </filter>
    <filter id="ddl-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ddl-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="ddl-chamber-clip">
      <path d="M455 281C455 244 486 221 533 221C580 221 611 244 611 281V535C611 573 580 596 533 596C486 596 455 573 455 535Z"/>
    </clipPath>
    <mask id="ddl-capsule-split">
      <rect x="0" y="0" width="1200" height="900" fill="white"/>
      <path d="M484 398L578 460" stroke="black" stroke-width="5"/>
    </mask>
  </defs>

  <rect width="1200" height="900" fill="#FFFFFF"/>

