    <circle cx="1089" cy="462" r="6" stroke="#25D3A1" stroke-opacity=".45"/>
  </g>
  <ellipse cx="606" cy="746" rx="421" ry="90" fill="#AFC8D8" opacity=".18" filter="url(#ddl-soft)"/>

