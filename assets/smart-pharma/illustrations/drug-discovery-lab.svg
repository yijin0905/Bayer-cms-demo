    <path d="M465 301V514" stroke="#FFFFFF" stroke-opacity=".84" stroke-width="8" stroke-linecap="round"/>
    <path d="M600 310V500" stroke="#2878FF" stroke-opacity=".26" stroke-width="4" stroke-linecap="round"/>

