      <path d="M672 279c29 0 51 23 51 52 0 20-10 37-25 46 48 16 82 61 82 114v136c0 32-26 58-58 58H621c-32 0-58-26-58-58V491c0-53 34-98 82-114-15-9-25-26-25-46 0-29 23-52 52-52Z" fill="#FFFFFF"/>
    </mask>
    <clipPath id="pmd-dashboard-clip">
      <path d="M19 0h242l19 19v174H19L0 174V19L19 0Z"/>
    </clipPath>
  </defs>

