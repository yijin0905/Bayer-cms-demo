<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none" role="img" aria-labelledby="pmd-title pmd-desc">
  <title id="pmd-title">Precision medicine data analysis</title>
  <desc id="pmd-desc">A futuristic precision medicine scene with a luminous DNA helix, patient digital twin, circular scan rings, genomic dashboard, and personalized capsule dose data.</desc>
  <defs>
    <linearGradient id="pmd-deck" x1="226" y1="408" x2="909" y2="790" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".54" stop-color="#F3FAFD"/>
      <stop offset="1" stop-color="#E5EFF5"/>
    </linearGradient>
    <linearGradient id="pmd-deck-edge" x1="289" y1="617" x2="687" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8E8F0"/>
      <stop offset=".6" stop-color="#ADC7D6"/>
      <stop offset="1" stop-color="#EDF6FA"/>
    </linearGradient>
    <linearGradient id="pmd-blue-glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".94"/>
      <stop offset=".42" stop-color="#C7F2FF" stop-opacity=".65"/>
      <stop offset="1" stop-color="#2878FF" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="pmd-green-glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".94"/>
      <stop offset=".48" stop-color="#A5F6DC" stop-opacity=".65"/>
      <stop offset="1" stop-color="#25D3A1" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="pmd-dna-a" x1="336" y1="187" x2="493" y2="674" gradientUnits="userSpaceOnUse">
      <stop stop-color="#37C8F5"/>
      <stop offset=".48" stop-color="#2878FF"/>
      <stop offset="1" stop-color="#25D3A1"/>
    </linearGradient>
    <linearGradient id="pmd-dna-b" x1="489" y1="188" x2="333" y2="673" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25D3A1"/>
      <stop offset=".5" stop-color="#37C8F5"/>
      <stop offset="1" stop-color="#2878FF"/>
    </linearGradient>
    <linearGradient id="pmd-scan" x1="519" y1="329" x2="832" y2="658" gradientUnits="userSpaceOnUse">
      <stop stop-color="#37C8F5"/>
      <stop offset=".5" stop-color="#2878FF"/>
      <stop offset="1" stop-color="#25D3A1"/>
    </linearGradient>
    <linearGradient id="pmd-body" x1="637" y1="287" x2="698" y2="661" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset=".2" stop-color="#B7F2FF" stop-opacity=".68"/>
      <stop offset=".62" stop-color="#2878FF" stop-opacity=".24"/>
      <stop offset="1" stop-color="#25D3A1" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="pmd-body-edge" x1="623" y1="330" x2="728" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".24" stop-color="#37C8F5"/>
      <stop offset=".68" stop-color="#2878FF"/>
      <stop offset="1" stop-color="#25D3A1"/>
    </linearGradient>
    <linearGradient id="pmd-capsule-blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EAFBFF"/>
      <stop offset=".45" stop-color="#37C8F5"/>
      <stop offset="1" stop-color="#2878FF"/>
    </linearGradient>
    <linearGradient id="pmd-capsule-green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EEFFF9"/>
      <stop offset=".52" stop-color="#25D3A1"/>
      <stop offset="1" stop-color="#12A984"/>
    </linearGradient>
    <linearGradient id="pmd-metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".48" stop-color="#DAE8EF"/>
      <stop offset=".72" stop-color="#AFC8D6"/>
      <stop offset="1" stop-color="#F8FCFE"/>
    </linearGradient>
    <radialGradient id="pmd-ambient" cx="0" cy="0" r="1" gradientTransform="translate(596 454) rotate(90) scale(367 492)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#37C8F5" stop-opacity=".13"/>
      <stop offset=".64" stop-color="#2878FF" stop-opacity=".035"/>
      <stop offset="1" stop-color="#2878FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pmd-core-glow" cx="0" cy="0" r="1" gradientTransform="translate(670 452) rotate(90) scale(182 141)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".94"/>
      <stop offset=".48" stop-color="#C7F5FF" stop-opacity=".36"/>
      <stop offset="1" stop-color="#37C8F5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pmd-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#2878FF" fill-opacity=".12"/>
    </pattern>
    <filter id="pmd-shadow" x="-30%" y="-30%" width="160%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#4B7790" flood-opacity=".18"/>
    </filter>
    <filter id="pmd-object-shadow" x="-40%" y="-40%" width="180%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#356A8F" flood-opacity=".17"/>
    </filter>
    <filter id="pmd-panel-shadow" x="-30%" y="-40%" width="160%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2878FF" flood-opacity=".14"/>
    </filter>
    <filter id="pmd-glow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="pmd-glow-blur"/>
      <feMerge>
        <feMergeNode in="pmd-glow-blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pmd-soft-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="19"/>
    </filter>
    <mask id="pmd-body-mask">
