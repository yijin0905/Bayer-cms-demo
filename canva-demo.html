<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canva 模拟编辑器</title><style>
*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#293e46;background:#edf1f3}button,select,input{font:inherit}button{cursor:pointer;border:1px solid #d5e0e4;border-radius:5px;background:#fff;padding:9px 14px;color:#365963}header{height:64px;background:white;display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid #dce5e9}header small{color:#809099}header button{margin-left:auto;background:#247b70;color:white;border:0}main{display:grid;grid-template-columns:190px minmax(0,1fr);height:calc(100dvh - 64px)}aside{background:white;padding:20px;display:flex;flex-direction:column;gap:16px}aside label{font-size:12px;display:grid;gap:8px}aside input[type=file]{width:100%;font-size:11px}section{overflow:auto;padding:24px}article{max-width:780px;min-height:920px;padding:48px;margin:auto;background:white;outline:0;font-size:16px;line-height:1.9;box-shadow:0 2px 16px #30465115}article h1,article h2{color:var(--accent,#247b70)}article img{max-width:100%;cursor:pointer}article figure{margin:20px 0}article figcaption{font-size:12px;color:#819198}.muted{font-size:12px;color:#819198;line-height:1.7}@media(max-width:600px){main{grid-template-columns:130px minmax(0,1fr)}aside{padding:12px}article{padding:22px}section{padding:12px}header{padding:10px;gap:8px}header small{display:none}}
header{background:linear-gradient(105deg,#00bdc4,#5b66df 65%,#8444df);color:white;border:0;gap:22px}header b{font-size:18px}header small{color:#ffffffd9}header button{background:white;color:#463861;font-weight:600}body{background:#eeeef2;color:#33313c}main{grid-template-columns:76px 210px minmax(0,1fr);height:calc(100dvh - 106px)}nav{background:white;border-right:1px solid #e4e2ea;display:flex;flex-direction:column;gap:8px;padding-top:14px}nav button{border:0;border-radius:0;display:grid;gap:6px;place-items:center;padding:12px 2px;font-size:11px}nav i{font-style:normal;font-size:24px}nav .active{background:#f0eafb;color:#7d3ec1}aside{border-right:1px solid #e0dfe6;padding:20px 16px}aside select{padding:8px;border:1px solid #dedde5;border-radius:5px;background:white}section{padding:24px 30px;overflow:auto}.text-toolbar{position:sticky;top:0;z-index:1;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:white;border-radius:6px;padding:6px;max-width:660px;margin:0 auto 24px;box-shadow:0 3px 12px #31304815}.text-toolbar button{border:0;padding:6px 12px}.canvas-wrap{max-width:560px;margin:auto}article{width:100%;min-height:1100px;max-width:none;padding:40px 30px;background:#a7eef0;color:#234765;overflow-wrap:anywhere}article:focus{outline:2px solid #944ee6}article h1{font-size:38px;line-height:1.35;font-style:italic;font-weight:900;text-align:center;margin:0 0 28px}article h2{font-size:23px;border-bottom:2px solid currentColor;padding:10px 8px;margin:26px 0 12px}article p{background:#ffffff99;padding:14px 18px;margin:10px 0}footer{height:42px;background:white;border-top:1px solid #ddd;display:flex;align-items:center;gap:18px;padding:0 18px;font-size:12px}footer input{margin-left:auto;width:140px;accent-color:#8b45dc}@media(max-width:850px){main{grid-template-columns:62px minmax(0,1fr)}aside{display:none}header small{display:none}header{padding:0 12px;gap:10px}section{padding:18px 12px}article{padding:24px 18px}article h1{font-size:30px}}
</style></head><body><header><b>Canva</b><span>文件</span><span>编辑</span><button data-command="undo" title="撤销">↶</button><button data-command="redo" title="重做">↷</button><small>医学与推广内容 · 模拟编辑器</small><button id="save" disabled>保存并返回 CMS ↗</button></header><main><nav><button class="active" data-panel="设计"><i>▧</i>设计</button><button data-panel="素材"><i>◇</i>素材</button><button data-panel="文字"><i>T</i>文字</button><button data-panel="品牌"><i>♧</i>品牌</button><button data-panel="上传"><i>↑</i>上传</button><button data-panel="工具"><i>▦</i>工具</button><button data-panel="项目"><i>▱</i>项目</button></nav><aside><b id="panel-title">设计样式</b><label>模板<select id="template"><option value="simple">蓝绿医学专题</option><option value="editorial">简洁白底</option></select></label><label>主题色<input id="color" type="color" value="#0879cb"></label><label>正文字号<select id="font"><option>14</option><option selected>16</option><option>18</option><option>20</option></select></label><button id="bold"><b>B</b> 加粗</button><label>添加 / 替换图片<input id="image" type="file" accept="image/*"></label><p class="muted">选中画布图片可替换；未选中时在末尾添加。</p><p id="status" class="muted">正在等待 CMS 内容…</p></aside><section><div class="text-toolbar"><span>思源黑体</span><button data-command="bold" title="加粗"><b>B</b></button><button data-command="italic" title="斜体"><i>I</i></button><button data-command="underline" title="下划线"><u>U</u></button><button data-command="justifyCenter" title="居中">≡</button><button id="addtext">T＋</button><button id="addimage">▧＋</button></div><div class="canvas-wrap"><article id="canvas" contenteditable="true"></article></div></section></main><footer><span>备注</span><span>第 1 页 / 共 1 页</span><input id="zoom" type="range" min="50" max="125" value="100" aria-label="缩放"><span id="zoom-label">100%</span></footer><script>
const canvas=document.getElementById('canvas'),color=document.getElementById('color'),font=document.getElementById('font');let selectedImage=null,ready=false;
function style(){canvas.style.setProperty('--accent',color.value);canvas.style.fontSize=font.value+'px'}
window.addEventListener('message',e=>{if(e.source!==window.opener||e.data?.type!=='bayer-canva-init'||ready)return;ready=true;canvas.innerHTML=e.data.html;const saved=canvas.querySelector('[data-canva-design]');if(saved){canvas.style.cssText=saved.getAttribute('style')||'';canvas.innerHTML=saved.innerHTML}canvas.querySelectorAll('script,iframe,object,embed').forEach(x=>x.remove());color.value=e.data.color;font.value=e.data.font;style();document.getElementById('save').disabled=false;document.getElementById('status').textContent='内容已载入，可直接编辑画布文字。'});
color.oninput=font.onchange=style;
document.getElementById('template').onchange=e=>{canvas.style.background=e.target.value==='editorial'?'#ffffff':'#a7eef0'};
canvas.addEventListener('click',e=>{selectedImage=e.target.tagName==='IMG'?e.target:null});
document.getElementById('bold').onmousedown=e=>e.preventDefault();document.getElementById('bold').onclick=()=>document.execCommand('bold');
document.getElementById('image').onchange=e=>{const file=e.target.files[0];if(!file||!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>{if(selectedImage&&canvas.contains(selectedImage))selectedImage.src=reader.result;else{const img=document.createElement('img');img.src=reader.result;img.alt=file.name;canvas.append(img)}e.target.value=''};reader.readAsDataURL(file)};
document.getElementById('save').onclick=()=>{const design=document.createElement('article');design.dataset.canvaDesign='';design.style.cssText=canvas.style.cssText;design.innerHTML=canvas.innerHTML;window.opener?.postMessage({type:'bayer-canva-save',html:design.outerHTML,color:color.value,font:font.value},'*');document.getElementById('status').textContent='已发送至 CMS…'};
document.querySelectorAll('[data-command]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>document.execCommand(b.dataset.command)});
document.getElementById('addtext').onclick=()=>{const p=document.createElement('p');p.textContent='新增文字';canvas.append(p);canvas.focus()};
document.getElementById('addimage').onclick=()=>document.getElementById('image').click();
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{document.querySelector('nav .active')?.classList.remove('active');b.classList.add('active');document.getElementById('panel-title').textContent=b.dataset.panel;if(['素材','上传'].includes(b.dataset.panel))document.getElementById('image').click();if(b.dataset.panel==='文字')document.getElementById('addtext').click()});
document.getElementById('zoom').oninput=e=>{document.querySelector('.canvas-wrap').style.zoom=e.target.value/100;document.getElementById('zoom-label').textContent=e.target.value+'%'};
if(window.opener)window.opener.postMessage({type:'bayer-canva-ready'},'*');else document.getElementById('status').textContent='请从 CMS 的 Canva 排版按钮打开此页面。';
</script></body></html>
